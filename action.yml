name: Thinker project checks
description: Run reviewed project commands and write local review receipts. No uploads or PR writes.
inputs:
  trust-project-commands:
    description: Set to true only after reviewing this checkout and thinker.config.json. Commands execute repository code.
    required: true
    default: 'false'
  working-directory:
    description: Project directory containing thinker.config.json; defaults to the checked-out workspace.
    required: false
    default: '.'
runs:
  using: composite
  steps:
    - name: Install locked Action runtime dependencies
      shell: bash
      run: npm ci --prefix "$GITHUB_ACTION_PATH" --ignore-scripts --omit=dev --no-audit --no-fund
    - name: Run reviewed checks
      shell: bash
      env:
        THINKER_PROJECT_DIRECTORY: ${{ inputs.working-directory }}
        THINKER_TRUST_PROJECT_COMMANDS: ${{ inputs.trust-project-commands }}
      run: node "$GITHUB_ACTION_PATH/scripts/action.mjs"
