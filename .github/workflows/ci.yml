name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run demo
      - name: Action trust guard (must refuse)
        shell: bash
        run: |
          if node scripts/action.mjs; then
            echo "Action ran without explicit trust"
            exit 1
          fi
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create disposable Action fixture
        run: |
          mkdir -p "$RUNNER_TEMP/thinker-action-fixture"
          cd "$RUNNER_TEMP/thinker-action-fixture"
          git init
          printf '%s' '{"version":1,"checks":[{"name":"node","command":["node","--version"]}]}' > thinker.config.json
      - name: Run actual composite Action
        uses: ./
        env:
          GITHUB_WORKSPACE: ${{ runner.temp }}/thinker-action-fixture
        with:
          trust-project-commands: 'true'
